# Windows 환경을 위한 최종 docker-compose.yaml
x-airflow-common:
  &airflow-common
  image: apache/airflow:2.8.4-python3.9
  environment:
    &airflow-common-environment
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/1
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.session'
    _PIP_ADDITIONAL_REQUIREMENTS: /opt/airflow/backend/requirements.txt
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./backend:/opt/airflow/backend
  networks:
    - default
  depends_on:
    - postgres
    - redis

services:
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5433:5432" # FastAPI DB(5432)와 충돌 방지
    networks:
      - default

  redis:
    image: redis:latest
    container_name: airflow-redis
    networks:
      - default

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade && \
        airflow users create \
          --username airflow --firstname Airflow --lastname Admin \
          --role Admin --email admin@example.com --password airflow
  
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    container_name: airflow-webserver
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: airflow-scheduler
    restart: always

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    container_name: airflow-worker
    restart: always

networks:
  default:
    name: trend-ai-network # FastAPI의 docker-compose.yml에 정의된 네트워크 이름
    external: true