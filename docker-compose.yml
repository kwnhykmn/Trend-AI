services:
  # 백엔드 API 서버 서비스
  backend:
    container_name: trend-ai-backend-container
    build:
      context: ./backend  # ./backend 폴더를 빌드 컨텍스트로 사용
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # 호스트의 ./backend/app 폴더를 컨테이너의 /app/app 폴더와 연결 (코드 실시간 반영)
      - ./backend/app:/app/app
    env_file:
      # ./backend/.env 파일을 환경 변수로 사용
      - ./backend/.env
    depends_on:
      - db # db 서비스가 먼저 실행되도록 보장
    networks: # 사용할 네트워크 지정
      - default

  # PostgreSQL 데이터베이스 서비스
  db:
    container_name: trend-ai-db-container
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      # 데이터를 영속적으로 저장하기 위한 볼륨
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGR ES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydatabase
    networks:
      - default

# Docker 네트워크 정의
networks:
  default:
    name: trend-ai-network # 네트워크에 명시적인 이름 부여

# Docker 볼륨 정의
volumes:
  pgdata: